# WorkBuddy Remote —— 官网 + 反向 SSH 隧道回源到工作机
#
# 与旧版的区别：根路径 / 现在是静态官网（/var/www/wb），
# 应用挪到 /app，其余接口路径（/events、/md.js、/icons/ …）照旧代理到桥。
#
# 为什么应用不放在 /app/ 子路径下面整体反代，而是让桥自己认 /app：
#   前端里引用的都是绝对路径（/md.js、/events、/icons/icon-192.png），
#   子路径反代要 rewrite 掉前缀，SSE 和图标很容易漏掉一个；
#   让桥上多认一个路径，前端和隧道侧一个字都不用改，风险最小。
#
# 上游 127.0.0.1:18797 由 ssh -R 建立，不对外暴露。

map $http_upgrade $wb_conn {
    default upgrade;
    ''      close;
}

# 上游连接池。反向 SSH 隧道里每新建一条 TCP 连接都要额外经工作机一次往返
# （ssh 通道打开 → 本地 connect → 应答），一个页面要拉 6+ 个资源，
# 不复用的话每个请求都白付一次 RTT，实测抖动 0.3~1.6s。
upstream wb_backend {
    server 127.0.0.1:18797;
    keepalive 32;
    keepalive_timeout 75s;
    keepalive_requests 1000;
}

server {
    listen 80;
    server_name wb.hackmo.net;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name wb.hackmo.net;

    ssl_certificate     /etc/letsencrypt/live/wb.hackmo.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wb.hackmo.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WB:10m;
    ssl_session_timeout 1d;

    # 源站缓冲必须关：SSE 靠它才能实时推送
    proxy_buffering off;
    proxy_request_buffering off;

    client_max_body_size 64m;

    root /var/www/wb;
    index index.html;

    # ---------- 官网静态资源 ----------
    # 只有这几个精确路径交给静态站。用精确匹配（=）而不是 prefix，
    # 免得 /icons/、/events 之类被静态规则抢走。
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300";
    }
    location = /index.html {
        add_header Cache-Control "public, max-age=300";
    }
    location = /site.css {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /icon-512.png {
        add_header Cache-Control "public, max-age=604800";
    }
    location = /apple-touch-icon.png {
        add_header Cache-Control "public, max-age=604800";
    }
    location = /shot-app.jpg {
        add_header Cache-Control "public, max-age=604800";
    }
    # 作者头像。漏了这一条的话请求会落到下面的 location / ，
    # 被当成应用资源转给桥，桥要求 token，返回 401 —— 头像就裂了。
    location = /avatar.jpg {
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- 应用本体 ----------
    location = /app {
        proxy_pass http://wb_backend;
        include /etc/nginx/snippets/wb-proxy.inc;
    }

    location / {
        proxy_pass http://wb_backend;
        include /etc/nginx/snippets/wb-proxy.inc;
    }
}