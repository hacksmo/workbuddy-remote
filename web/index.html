$('#pvClose').onclick = closePreview;
$('#pvGo').onclick = () => openPreview($('#pvUrl').value.trim());
$('#pvScan').onclick = scanHtmlPath;
$('#pvReload').onclick = () => { const f = $('#pvFrame'); f.src = f.src; };
$('#pvUrl').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#pvGo').click(); });

$('#new').onclick = createSession;
$('#refresh').onclick = () => loadSessions().catch((e) => toast(e.message));
$('#q').oninput = renderList;

// ── 窄屏抽屉 ──────────────────────────────────────────────────
// 侧栏在窄屏是固定的覆盖层，不加收起按钮就没有回路。
const closeNav = () => document.documentElement.classList.remove('nav-open');
$('#navBtn').onclick = () => document.documentElement.classList.add('nav-open');
$('#scrim').onclick = closeNav;
$('#new').addEventListener('click', closeNav);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNav(); });

// 输入框提示在窄屏放不下，换成短的。原文案对新用户有说明作用，
// 所以只在窄屏替换，不改桌面端。
const PH_LONG = $('#input').placeholder;
const PH_SHORT = '输入消息…';
const mqNarrow = window.matchMedia('(max-width:900px)');
const syncPlaceholder = () => {
  $('#input').placeholder = mqNarrow.matches ? PH_SHORT : PH_LONG;
};
syncPlaceholder();
mqNarrow.addEventListener('change', syncPlaceholder);

// 用户往上翻就停止跟随，翻回底部则恢复。这样新内容到达时不会把正在
// 回看历史的用户硬拽到底部。
$('#msgs').addEventListener('scroll', () => {
  state.stick = atBottom($('#msgs'));
  syncToBottomBtn();
}, { passive: true });
$('#send').onclick = () => {
  // 生成期间：输入框有内容 → 排队；空 → 停止。与按钮文案一致。
  const hasText = $('#input').value.trim().length > 0 || pendingImages.length > 0;
  if (state.running && !hasText) return stopRun();
  return send();
};
$('#input').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  // 输入法组字期间的回车是在选词，不能当成发送
  if (e.isComposing || e.keyCode === 229) return;

  if (e.metaKey || e.ctrlKey) { e.preventDefault(); send(); return; }

  // 默认回车发送，Shift+Enter / Alt+Enter 换行（与桌面端一致）
  if (e.shiftKey || e.altKey) return;
  e.preventDefault();
  send();
});
$('#input').addEventListener('input', (e) => {
  const t = e.target;
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 190) + 'px';
  updateSendBtn();  // 生成期间按钮要在「排队 / 停止」之间切换
});

/* ── 远程终端 ──────────────────────────────────────────────────
   链路：xterm.js ← WebSocket ← 桥 ← python PTY ← shell

   两个和 ttyd/gotty 不一样的地方，都是被这个项目的处境逼出来的：
   1. 会话留在桥进程里（ring buffer 回放），不依赖 tmux。
      tmux 不是默认装的，为一个终端功能要求用户先 brew install 说不过去。
   2. 重连按 sid 复用同一个 PTY，所以刷新页面、换设备、断 WiFi 之后
      正在跑的命令还在，屏幕内容也会补回来。
*/
const termState = {
  tabs: [],          // { uid, sid, name, el, term, fit, ws, alive, exited }
  active: null,      // 指向 tab 对象本身，不用 sid 索引 ——
                     // sid 要等后端 ready 回来才确定，用 sid 当键会在
                     // 「刚建标签、ready 还没到」这段时间里找不到自己
  open: false,
  libs: null,        // Promise，避免重复注入
  ctrlArmed: false,
  altArmed: false,
  zoom: 1,
};
let termUid = 0;

/** 首次打开终端时才拉 xterm.js —— 290KB 不该让所有人付。
 *
 *  三个资源**并行**拉，不是串行 await。这不是洁癖：
 *  公网访问时每个请求要经过 nginx → SSH 隧道 → 工作机，单程 300ms 起，
 *  实测单个响应 TTFB 1.7s。串行拉三个就是 5s+，用户点开终端盯五秒白屏，
 *  会以为坏了。并行之后总耗时约等于最慢的那个。
 */
function loadTermLibs() {
  if (termState.libs) return termState.libs;
  termState.libs = new Promise((resolve, reject) => {
    const jobs = [];

    jobs.push(new Promise((ok, no) => {
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = '/vendor/xterm.css';
      css.onload = ok;
      // 样式拉不到不该让整个终端打不开，终端还是能用的
      css.onerror = ok;
      document.head.appendChild(css);
    }));

    for (const src of ['/vendor/xterm.js', '/vendor/addon-fit.js']) {
      jobs.push(new Promise((ok, no) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = ok;
        s.onerror = () => no(new Error('加载失败: ' + src));
        document.head.appendChild(s);
      }));
    }

    Promise.all(jobs).then(() => resolve()).catch(reject);
  });
  // 失败了要允许重试，否则一次网络抖动就永远打不开
  termState.libs.catch(() => { termState.libs = null; });
  return termState.libs;
}

/** 终端配色跟随页面主题，读 CSS 变量而不是再写一套色板 */
function termTheme() {
  const cs = getComputedStyle(document.documentElement);
  const v = (n) => cs.getPropertyValue(n).trim();
  const dark = !document.documentElement.dataset.theme
    || ['midnight'].includes(document.documentElement.dataset.theme)
    || document.documentElement.dataset.theme === 'dark';
  const bg = v('--panel') || '#1a1a1a';
  const fg = v('--text') || '#ececec';
  const accent = v('--accent') || '#3b82f6';
  return {
    background: bg,
    foreground: fg,
    cursor: accent,
    cursorAccent: bg,
    selectionBackground: dark ? 'rgba(120,160,255,.30)' : 'rgba(37,99,235,.22)',
    /* 16 色板。深色用一组降饱和的亮色，浅色主题则要压暗，
       否则白底上黄色和青色完全看不清。 */
    black: dark ? '#3b4048' : '#24292f',
    red: dark ? '#e06c75' : '#cf222e',
    green: dark ? '#98c379' : '#116329',
    yellow: dark ? '#e5c07b' : '#953800',
    blue: dark ? '#61afef' : '#0969da',
    magenta: dark ? '#c678dd' : '#8250df',
    cyan: dark ? '#56b6c2' : '#1b7c83',
    white: dark ? '#dcdfe4' : '#6e7781',
    brightBlack: dark ? '#5c6370' : '#57606a',
    brightRed: dark ? '#e8838c' : '#a40e26',
    brightGreen: dark ? '#b3d18b' : '#1a7f37',
    brightYellow: dark ? '#f0d197' : '#7d4e00',
    brightBlue: dark ? '#82c0f5' : '#218bff',
    brightMagenta: dark ? '#d99ae8' : '#a475f9',
    brightCyan: dark ? '#7fd0da' : '#3192aa',
    brightWhite: dark ? '#f2f4f8' : '#8c959f',
  };
}

function termTokenQS() {
  // WS 握手没法带 Authorization 头，只能走 query。拿到 401 时桥会直接关连接，
  // 前端表现为「已断开」，所以这里必须和 api() 用同一个 token 来源。
  const t = getToken();
  return t ? '&token=' + encodeURIComponent(t) : '';
}

function termActiveTab() {
  return termState.active && termState.tabs.includes(termState.active) ? termState.active : null;
}

function setTermState(txt, bad) {
  const el = $('#termState');
  el.textContent = txt || '';
  el.classList.toggle('bad', !!bad);
}

function renderTermTabs() {
  const box = $('#termTabs');
  box.textContent = '';
  termState.tabs.forEach((t) => {
    const b = document.createElement('div');
    b.className = 'term-tab' + (t === termState.active ? ' on' : '');

    const dot = document.createElement('i');
    dot.className = 'st ' + (t.exited ? 'dead' : (t.alive ? 'live' : ''));

    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = t.name;

    const x = document.createElement('i');
    x.className = 'x';
    x.textContent = '×';
    x.onclick = (e) => { e.stopPropagation(); closeTermTab(t); };

    b.append(dot, nm, x);
    b.onclick = () => activateTermTab(t);
    box.appendChild(b);
  });
}

/** 标签页切换 = 切换可见的 xterm 实例。
 *  多个实例共用同一个 .term-body 会互相踩尺寸，所以每个 tab 一个 <div>，
 *  切的时候只显示一个 —— 和 IDE 里切终端标签一个意思。 */
function activateTermTab(tab) {
  if (!tab || !termState.tabs.includes(tab)) return;
  termState.active = tab;
  termState.tabs.forEach((t) => {
    if (t.el) t.el.style.display = t === tab ? '' : 'none';
  });
  renderTermTabs();
  // 显示出来才能量到真实尺寸，fit 必须在这之后
  requestAnimationFrame(() => {
    try { tab.fit && tab.fit.fit(); } catch {}
    try { tab.term && tab.term.focus(); } catch {}
    // 第一次激活时才连：这时候 cols/rows 是真的了。
    // 已经连过（或连过又断了）就不重复建，交给 onclose 里的重连逻辑。
    if (!tab.ws) connectTerm(tab);
    else syncTermSize(tab);
  });
  if (tab.exited) setTermState('已退出' + (tab.exitCode != null ? `（${tab.exitCode}）` : ''), true);
  else setTermState(tab.alive ? '已连接' : (tab.ws ? '连接中…' : '准备中…'), !tab.alive && !!tab.ws);
}

/** 把 xterm 算出来的 cols/rows 告诉后端 PTY */
function syncTermSize(tab) {
  if (!tab || !tab.term || !tab.ws || tab.ws.readyState !== 1) return;
  const { cols, rows } = tab.term;
  if (cols === tab._cols && rows === tab._rows) return;
  tab._cols = cols; tab._rows = rows;
  try { tab.ws.send(JSON.stringify({ type: 'resize', cols, rows })); } catch {}
}

function makeTermTab(sid, name) {
  const el = document.createElement('div');
  el.className = 'term-el';
  el.style.cssText = 'width:100%;height:100%;display:none';
  $('#termBody').appendChild(el);

  const term = new Terminal({
    /* 字体栈顺序有讲究。`ui-monospace` 看着最"现代"，但它在部分
       Chromium 版本/配置里会解析失败并回退到**非等宽**的默认字体 ——
       实测每字符 11px（Menlo 是 7.5px），结果 980px 的容器只排出
       38 列，内容全挤在左边一小块，右边一片空。
       把确定存在的等宽字体排在前面，`ui-monospace` 放最后当锦上添花。 */
    fontFamily: 'SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", ui-monospace, monospace',
    fontSize: 13,
    lineHeight: 1.2,
    letterSpacing: 0,
    cursorBlink: true,
    cursorStyle: 'bar',
    scrollback: 3000,
    allowProposedApi: true,
    theme: termTheme(),
    // 触屏上 selection 更容易误触，用长按选词而不是拖选
    rightClickSelectsWord: true,
    macOptionIsMeta: true,
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(el);

  const tab = { uid: ++termUid, sid, name, el, term, fit, ws: null, alive: false, exited: false, _cols: 0, _rows: 0 };
  termState.tabs.push(tab);

  // 键盘 → 二进制帧。终端输入必须是裸字节，
  // 走文本帧再 JSON 包一层会把 0x00-0x1f 的控制字符弄坏。
  term.onData((d) => {
    if (!tab.ws || tab.ws.readyState !== 1) return;
    try { tab.ws.send(new TextEncoder().encode(d)); } catch {}
  });
  term.onResize(() => syncTermSize(tab));

  // 点终端里随便一处都该把焦点给回终端，否则敲键盘没反应
  el.addEventListener('mousedown', () => setTimeout(() => term.focus(), 0));

  // 这里**不能**立刻连。元素还是 display:none 的时候 xterm 量到的是
  // 0×0，算出来的 cols 会退到最小值，PTY 用 2 列启动 —— shell 会把每个字
  // 都换行，屏幕上一片竖排乱码，而且这段垃圾已经进了 scrollback 洗不掉。
  // 连接统一交给 activateTermTab：显示出来 → fit 拿到真实行列 → 再连。
  return tab;
}

function connectTerm(tab) {
  const cols = Math.max(20, tab.term.cols || 80);
  const rows = Math.max(5, tab.term.rows || 24);
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/terminal/ws?cols=${cols}&rows=${rows}`
    + (tab.sid ? '&sid=' + encodeURIComponent(tab.sid) : '')
    + termTokenQS();

  let ws;
  try { ws = new WebSocket(url); } catch (e) {
    setTermState('无法连接：' + e.message, true);
    return;
  }
  ws.binaryType = 'arraybuffer';
  tab.ws = ws;
  tab.exited = false;
  // 连上到提示符出来之间有一段空窗：PTY 那侧要 fork 一个登录 shell，
  // 用户的 .zshrc / .zprofile 里 source 越多这段越长（实测这台机器 4.2s）。
  // 期间屏幕是纯黑的，看起来像卡住。先写一行灰字占位，
  // 收到第一个字节就擦掉。
  tab.term.write('\x1b[2m正在启动 shell…\x1b[0m');
  tab._wroteWait = true;

  ws.onopen = () => {
    tab.alive = true;
    // 连上了就把退避计数器归零。不归零的话，一天里累计断 7 次（桥重启、
    // 切网络、休眠唤醒都算）之后这个标签就永久停在「连接失败」——
    // 哪怕此刻连接完全正常。退避的语义是「连续失败才拉长间隔」，
    // 成功一次就该重新从 0 开始计。
    tab._retry = 0;
    setTermState('已连接');
    renderTermTabs();
  };

  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'ready') {
        // 后端给了 sid（首次连接用的临时 id，或原会话已死换了新的）
        if (m.sid) tab.sid = m.sid;
        if (m.reused) setTermState('已恢复上次会话');
        requestAnimationFrame(() => { try { tab.fit.fit(); } catch {} syncTermSize(tab); });
      } else if (m.type === 'exit') {
        tab.exited = true;
        tab.exitCode = m.code;
        setTermState('已退出' + (m.code != null ? `（${m.code}）` : ''), true);
        renderTermTabs();
        tab.term.write(`\r\n\x1b[2m[进程已退出，代码 ${m.code}。按 ↵ 或点 ＋ 新开一个]\x1b[0m\r\n`);
      }
      return;
    }
    // 二进制 = PTY 原始输出，直接喂给终端
    // 第一份真实输出到达时，把「正在启动 shell…」那行占位擦掉：
    // \r 回行首 + \x1b[K 清到行尾，再让 PTY 的字节自己画。
    if (tab._wroteWait) {
      tab._wroteWait = false;
      tab.term.write('\r\x1b[K');
    }
    tab.term.write(new Uint8Array(ev.data));
  };

  ws.onclose = () => {
    tab.alive = false;
    renderTermTabs();
    if (tab.exited) return;
    setTermState('连接已断开', true);
    // 退避重连：桥重启、隧道重连都会断，自动接回来比让用户点刷新好
    if (tab._retry == null) tab._retry = 0;
    tab._retry++;
    if (tab._retry > 6) {
      setTermState('连接失败，点 ＋ 重开', true);
      return;
    }
    const delay = Math.min(8000, 400 * Math.pow(1.7, tab._retry));
    tab.term.write(`\r\n\x1b[2m[连接断开，${(delay / 1000).toFixed(1)}s 后重连…]\x1b[0m\r\n`);
    tab._timer = setTimeout(() => {
      if (!termState.tabs.includes(tab)) return;
      connectTerm(tab);
    }, delay);
  };

  ws.onerror = () => {};
}

function closeTermTab(tab) {
  if (!tab) return;
  clearTimeout(tab._timer);
  try { tab.ws && tab.ws.close(); } catch {}
  // 主动关标签 = 真的结束会话，不是断开连接。否则后台会挂着 shell。
  // sid 可能还是 null（标签刚建、还没收到 ready 就关了），那种情况后端
  // 没有可杀的东西，别发一个 /sessions/null/kill 出去制造 404 噪音。
  if (tab.sid) {
    fetch('/terminal/sessions/' + encodeURIComponent(tab.sid) + '/kill', {
      method: 'POST',
      headers: getToken() ? { Authorization: 'Bearer ' + getToken() } : {},
    }).catch(() => {});
  }
  try { tab.term.dispose(); } catch {}
  tab.el.remove();
  const i = termState.tabs.indexOf(tab);
  if (i >= 0) termState.tabs.splice(i, 1);
  if (termState.active === tab) {
    const next = termState.tabs[termState.tabs.length - 1];
    termState.active = next || null;
    if (next) activateTermTab(next);
    else renderTermTabs();
  }
  if (!termState.tabs.length) hideTerm();
}

async function openTerm() {
  // 只要还有标签就直接复用。这里原本只判 `termState.open && tabs.length`，
  // 于是「点 × 收起 → 再点 >_ 打开」会走完整初始化、又 makeTermTab 建一个
  // 新标签 —— 实测连点 5 次变成 6 个 xterm 实例挂在同一个 PTY 上，
  // 内存和事件监听全泄漏，标签条也挤成一排。收起只是隐藏面板，
  // 标签本来就是留着的，那就直接显示回来。
  if (termState.tabs.length) {
    termState.open = true;
    $('#term').classList.add('open');
    watchTermResize();
    activateTermTab(termActiveTab() || termState.tabs[0]);
    return;
  }
  termState.open = true;
  $('#term').classList.add('open');
  watchTermResize();
  setTermState('加载终端组件…');
  try {
    await loadTermLibs();
  } catch (e) {
    setTermState('组件加载失败：' + e.message, true);
    return;
  }
  // 刷新后先问后端还有没有活着的会话，有就直接接回来。
  // 只接最近的一个：标签是用户可见的东西，刷新一次多四个标签比丢失会话
  // 更让人困惑。要新开就点 ＋。
  let restored = false;
  try {
    const list = await api('/terminal/sessions');   // api() 已经剥过 .value
    const alive = (Array.isArray(list) ? list : [])
      .filter((s) => !s.exited)
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    if (alive.length) {
      const s = alive[0];
      const tab = makeTermTab(s.sid, '终端 1');
      tab.sid = s.sid;
      restored = true;
    }
  } catch {}
  if (!restored) makeTermTab(null, '终端 1');
  const first = termState.tabs[0];
  activateTermTab(first);
  // 等一帧让 dock 完成布局，否则 fit 拿到的高度是 0
  requestAnimationFrame(() => requestAnimationFrame(() => {
    termState.tabs.forEach((t) => { try { t.fit.fit(); syncTermSize(t); } catch {} });
  }));
}

function hideTerm() {
  $('#term').classList.remove('open');
  termState.open = false;
}

$('#termToggle').onclick = () => {
  if ($('#term').classList.contains('open')) hideTerm();
  else openTerm().catch((e) => toast(e.message));
};
$('#termHide').onclick = hideTerm;
$('#termNew').onclick = () => {
  if (!termState.open) { openTerm(); return; }
  const tab = makeTermTab(null, '终端 ' + (termState.tabs.length + 1));
  renderTermTabs();
  activateTermTab(tab);
};
$('#termClear').onclick = () => {
  const t = termActiveTab();
  if (t) { t.term.clear(); t.term.focus(); }
};
$('#termFull').onclick = () => {
  const el = $('#term');
  const big = el.style.height === '86vh';
  el.style.height = big ? '' : '86vh';
  $('#termFull').textContent = big ? '⤢' : '⤡';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const t = termActiveTab();
    if (t) { try { t.fit.fit(); syncTermSize(t); } catch {} }
  }));
};

// 触屏键盘工具条。Ctrl / Alt 做成「粘滞」：点一下亮起来，
// 再敲下一个键时带上修饰符然后自动熄灭 —— 和手机输入法的行为一致。
$('#termKeys').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const tab = termActiveTab();
  if (!tab) return;
  const k = b.dataset.k;
  if (!tab.ws || tab.ws.readyState !== 1) return;
  const send = (s) => { try { tab.ws.send(new TextEncoder().encode(s)); } catch {} };

  if (k === 'ctrl') {
    termState.ctrlArmed = !termState.ctrlArmed;
    termState.altArmed = false;
    b.classList.toggle('armed', termState.ctrlArmed);
    syncArmed();
    tab.term.focus();
    return;
  }
  if (k === 'alt') {
    termState.altArmed = !termState.altArmed;
    termState.ctrlArmed = false;
    b.classList.toggle('armed', termState.altArmed);
    syncArmed();
    tab.term.focus();
    return;
  }

  const MAP = {
    esc: '\x1b', tab: '\t',
    up: '\x1b[A', down: '\x1b[B', right: '\x1b[C', left: '\x1b[D',
    ctrlc: '\x03', ctrld: '\x04',
    pipe: '|', dash: '-', slash: '/',
  };
  let s = MAP[k];
  if (s == null) return;
  // 粘滞修饰符只对单字符生效（方向键本身就是完整序列，不能再加前缀）
  if (s.length === 1 && termState.ctrlArmed) s = String.fromCharCode(s.toUpperCase().charCodeAt(0) & 0x1f);
  else if (s.length === 1 && termState.altArmed) s = '\x1b' + s;
  send(s);
  if (termState.ctrlArmed || termState.altArmed) {
    termState.ctrlArmed = false;
    termState.altArmed = false;
    syncArmed();
  }
  tab.term.focus();
});
function syncArmed() {
  document.querySelectorAll('#termKeys button[data-k="ctrl"], #termKeys button[data-k="alt"]')
    .forEach((b) => b.classList.toggle('armed', b.dataset.k === 'ctrl' ? termState.ctrlArmed : termState.altArmed));
}

// dock 尺寸变了要重新算行列，否则换窗口大小后进度条 / vim 会画错位
let termRO = null;
function watchTermResize() {
  if (termRO) return;
  const body = $('#termBody');
  if (!('ResizeObserver' in window)) {
    addEventListener('resize', () => { const t = termActiveTab(); if (t) { try { t.fit.fit(); syncTermSize(t); } catch {} } });
    return;
  }
  let raf = 0;
  termRO = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const t = termActiveTab();
      if (!t) return;
      try { t.fit.fit(); syncTermSize(t); } catch {}
    });
  });
  termRO.observe(body);
}

// 主题切换后终端的 16 色板要跟着换，否则浅色主题下终端还是黑底
const _origApplyTheme = applyTheme;
applyTheme = function (id) {
  _origApplyTheme(id);
  const th = termTheme();
  termState.tabs.forEach((t) => { try { t.term.options.theme = th; } catch {} });
};

// Ctrl/⌘ + ` 打开终端（IDE 的通用快捷键），和浏览器书签栏等不冲突
addEventListener('keydown', (e) => {
  if (e.key === '`' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    if ($('#term').classList.contains('open')) hideTerm();
    else openTerm().catch((err) => toast(err.message));
  }
});

(async () => {
  probeNet();  // 不 await：链路标识不该拖慢首屏
  // 第一次在手机/新设备上打开，本地没有令牌，一进来必定 401。
  // 这是**预期内的流程**，不是故障：直接给输入框，别弹「连接失败」。
  // 早先这里统一走 toast，手机用户看到「连接失败…如果走代理」会以为
  // 是网络坏了，去折腾代理设置，而其实只要输一次令牌。
  if (!getToken()) {
    showAuth();
    return;
  }
  try {
    await Promise.all([loadSessions(), loadSpaces(), loadModels()]);
    renderList();

    // 首屏稳定后空转时预取 xterm.js。经隧道拉 70KB 要三秒多，等用户
    // 真去点终端才拉，他得盯着「加载终端组件…」三秒。反正迟早要用，
    // 趁浏览器 idle 先把字节搬过来。加载失败不处理 —— 点击时 loadTermLibs
    // 会重试。
    const prefetch = () => { loadTermLibs().catch(() => {}); };
    if ('requestIdleCallback' in window) requestIdleCallback(prefetch, { timeout: 4000 });
    else setTimeout(prefetch, 2500);
    // focus 模式优先打开指定会话
    if (FOCUS) {
      await openSession(FOCUS);
      return;
    }
    const first = state.sessions.find((x) => (x.title || '').trim()) || state.sessions[0];
    if (first) openSession(first.id);
    // 恢复上次的预览面板。窄屏不恢复：手机上一开就是全屏预览，
    // 用户以为页面坏了，而且很难退回去（要先找到那个 × ）。
    if (localStorage.getItem('wb.previewOpen') === '1' && !mqNarrow.matches) openPreview();
  } catch (e) {
    // 令牌失效（改了密码、换了机器）也会走到这里。那种情况下输入框
    // 已经弹出来了，再说一遍「连接失败」纯属噪音。
    if (isAuthError(e)) return;
    toast('连接失败：' + e.message + '（如果走代理，请把 100.64.0.0/10 加入代理例外）');
  }
})();
</script>
